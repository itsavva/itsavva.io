<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #111;
            color: white;
            padding: 20px;
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 400px;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #444;
            border-radius: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <select id="siteSelect">
        <option value="https://google.com">BNB Free</option>
        <option value="https://www.youtube.com">YouTube</option>
        <option value="https://www.github.com">GitHub</option>
    </select>
    <div class="container">
        <iframe id="iframe" src="https://www.google.com"></iframe>
        <div class="controls">
            <button onclick="prevSite()">&#9664;</button>
            <button onclick="nextSite()">&#9654;</button>
        </div>
    </div>
    <script>
        const sites = [
            "https://www.google.com",
            "https://www.youtube.com",
            "https://www.github.com"
        ];
        let currentIndex = 0;
        const iframe = document.getElementById("iframe");
        const siteSelect = document.getElementById("siteSelect");
        
        function updateIframe(index) {
            iframe.src = sites[index];
            siteSelect.value = sites[index];
        }
        
        function prevSite() {
            currentIndex = (currentIndex === 0) ? sites.length - 1 : currentIndex - 1;
            updateIframe(currentIndex);
        }
        
        function nextSite() {
            currentIndex = (currentIndex === sites.length - 1) ? 0 : currentIndex + 1;
            updateIframe(currentIndex);
        }
        
        siteSelect.addEventListener("change", function () {
            currentIndex = sites.indexOf(this.value);
            updateIframe(currentIndex);
        });
    </script>
</body>
</html>
