<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Free Coin </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #111;
            color: white;
            padding: 20px;
            margin: 0;
            height: 100vh;
            justify-content: center;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 800px;
            text-align: center;
        }
        .instruction {
            width: 100%;
            height: 300px;
            background-color: #222;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            overflow: auto;
            color: white;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            width: 40px;
            font-size: 18px;
        }
        button:hover {
            background-color: #444;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .open-link {
            margin-top: 20px;
        }
        .open-link a {
            color: #4CAF50;
            font-size: 18px;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #333;
        }
        .open-link a:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <select id="siteSelect">
        <option value="freenem">Hot. FreeNem</option>
        <option value="bnbfree">1. BNB Free</option>
        <option value="ltcfree">2. LTC Free</option>
        <option value="btcfree">3. BTC Free</option>
         <option value="adspace">4. ADS PACE</option>
        <option value="Сoinfola">5. Сoinfola</option>    
        <option value="satoshilabs">6.satoshilabs</option> 
        <option value="cointiply">7. Cointiply</option> 
        <option value="allcoins">8. Allcoins</option> 
        <option value="firefaucet">9. Firefaucet</option> 
        <option value="claimcoin">10. Claimcoin </option> 
        <option value="cryptoflare">11. Cryptoflare</option> 
        <option value="autofaucet">12. Autofaucet</option>    
        <option value="faucetcrypto">13. Faucet Crypto</option>
    </select>
    <div class="container">
        <div id="instruction" class="instruction">Инструкция по использованию сайта.</div>
        <div class="controls">
            <button onclick="prevInstruction()">&#9664;</button>
            <button onclick="nextInstruction()">&#9654;</button>
        </div>
        <div class="open-link">
            <a id="openSiteLink" href="#" target="_blank">Открыть сайт</a>
        </div>
    </div>

    <script>
        const instructions = {
            freenem: "FreeNem - Инструкция",
            bnbfree: "BnB Free — Инструкция",
            ltcfree: "LTC Free — Инструкция",
            btcfree: "BTC Free — Инструкция",
            adspace: "ADS Pace — Инструкция.",
            coinfola: " Сoinfola — Инструкция.",
            satoshilabs: "satoshilabs — Инструкция.",
            cointiply: "cointiply — Инструкция.",
            allcoins: "allcoins — Инструкция.",
            firefaucet: "firefaucet — Инструкция.",        
            claimcoin: "claimcoin— Инструкция.",
            cryptoflare: "cryptoflare — Инструкция.",
            autofaucet: "autofaucet — Инструкция.",
            faucetcrypto: "Faucet Crypto — Инструкция."
        };

        const links = {
            freenem: "https://freenem.com/?ref=380066",
            bnbfree: "https://bnbfree.in/?r=513909",
            ltcfree: "https://free-litecoin.com/login?referer=6702447",
            btcfree: "https://freebitco.in/?r=54943152",
            adspace: "https://btcadspace.com/ref/Netsavva",
            coinfola: "https://coinfola.com/ref/Netsavva",
            satoshilabs: "https://satoshilabs.net/?r=103213",
            cointiply: "http://cointiply.com/r/DBVgJk",
            allcoins: "https://allcoins.pw/?ref=734716",
            firefaucet: "https://firefaucet.win/ref/1391813",        
            claimcoin: "https://claimcoin.in/?r=139895",
            cryptoflare: "https://cryptoflare.net/?r=246166",
            autofaucet: "https://autofaucet.dutchycorp.space/?r=Netsavva",
            faucetcrypto: "https://faucetcrypto.com/r/4305867"
        };

        const sites = ["freenem","bnbfree", "ltcfree", "btcfree","adspace", "coinfola", "satoshilabs", "cointiply", "allcoins", "firefaucet", "claimcoin", "cryptoflare", "autofaucet","faucetcrypto"];
        let currentIndex = 0;

        const instructionElement = document.getElementById("instruction");
        const siteSelect = document.getElementById("siteSelect");
        const openSiteLink = document.getElementById("openSiteLink");

        function updateInstruction(index) {
            const site = sites[index];
            instructionElement.innerHTML = instructions[site];
            siteSelect.value = site;
            openSiteLink.href = links[site]; // Обновляем ссылку для открытия сайта
            openSiteLink.innerText = `Перейти на ${site.charAt(0).toUpperCase() + site.slice(1)}`; // Обновляем текст ссылки
        }

        function prevInstruction() {
            currentIndex = (currentIndex === 0) ? sites.length - 1 : currentIndex - 1;
            updateInstruction(currentIndex);
        }

        function nextInstruction() {
            currentIndex = (currentIndex === sites.length - 1) ? 0 : currentIndex + 1;
            updateInstruction(currentIndex);
        }

        siteSelect.addEventListener("change", function () {
            currentIndex = sites.indexOf(this.value);
            updateInstruction(currentIndex);
        });

        // Инициализация с первой инструкции
        updateInstruction(currentIndex);
    </script>
</body>
</html>
