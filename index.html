<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #111;
            color: white;
            padding: 20px;
        }
        .container {
            position: relative;
            width: 90%;
            max-width: 600px;
        }
        .site-content {
            width: 100%;
            height: 500px;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 20px;
            background-color: #222;
            overflow: auto;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        button {
            background-color: #222;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <select id="siteSelect">
        <option value="https://www.google.com">Google</option>
        <option value="https://www.youtube.com">YouTube</option>
        <option value="https://www.github.com">GitHub</option>
    </select>
    <div class="container">
        <div id="siteContent" class="site-content">Загружаю сайт...</div>
        <div class="controls">
            <button onclick="prevSite()">&#9664;</button>
            <button onclick="nextSite()">&#9654;</button>
        </div>
    </div>

    <script>
        const sites = [
            "https://www.google.com",
            "https://www.youtube.com",
            "https://www.github.com"
        ];
        let currentIndex = 0;
        const siteContent = document.getElementById("siteContent");
        const siteSelect = document.getElementById("siteSelect");
        
        // Функция загрузки сайта
        function loadSite(index) {
            const site = sites[index];
            siteSelect.value = site;
            fetch(site)
                .then(response => response.text())
                .then(data => {
                    // Можно обработать полученные данные, например, извлечь какие-то заголовки
                    // Для демонстрации просто выводим текст HTML страницы
                    siteContent.innerHTML = data.substring(0, 2000);  // показываем первые 2000 символов страницы
                })
                .catch(err => {
                    siteContent.innerHTML = "Ошибка при загрузке сайта.";
                });
        }

        function prevSite() {
            currentIndex = (currentIndex === 0) ? sites.length - 1 : currentIndex - 1;
            loadSite(currentIndex);
        }

        function nextSite() {
            currentIndex = (currentIndex === sites.length - 1) ? 0 : currentIndex + 1;
            loadSite(currentIndex);
        }

        siteSelect.addEventListener("change", function () {
            currentIndex = sites.indexOf(this.value);
            loadSite(currentIndex);
        });

        // Инициализация начального сайта
        loadSite(currentIndex);
    </script>
</body>
</html>
