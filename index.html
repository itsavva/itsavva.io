<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт с визуальной частью</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .link-button {
            display: inline-block;
            margin: 10px 0;
            padding: 15px 25px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s ease;
        }
        .link-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Выберите сайт</h1>
    <a href="https://www.google.com" class="link-button" target="_blank">Открыть Google</a>
    <a href="https://www.github.com" class="link-button" target="_blank">Открыть GitHub</a>
    <a href="https://www.youtube.com" class="link-button" target="_blank">Открыть YouTube</a>
</body>
</html>
